name: "Setup Flutter and Patrol"
description: "Prepare environment for Patrol testing (Java, Flutter, FVM, Patrol)"

runs:
  using: "composite"
  steps:
    #แก้ปัญหาโหลด Package ผ่าน SSH (เปลี่ยนเป็น HTTPS อัตโนมัติ)
    - name: Configure Git to use HTTPS
      shell: bash
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"

    # ติดตั้ง Java (จำเป็นสำหรับ Android SDK และ Gradle)
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: "17"

    # ติดตั้ง Flutter และ Dart พื้นฐานเข้าไปใน Runner
    - name: Setup Flutter and Dart
      uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        cache: true

    # ติดตั้ง FVM
    - name: Install FVM
      shell: bash
      run: |
        dart pub global activate fvm
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

    # ติดตั้ง Flutter SDK ตามเวอร์ชันในไฟล์ .fvm/fvm_config.json
    - name: Install Flutter SDK via FVM
      shell: bash
      run: fvm install
