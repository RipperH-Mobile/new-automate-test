jobs:
  test:
    name: Execute Test Script
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write

    steps:
      - name: Clean Work Space
        run: rm -rf $GITHUB_WORKSPACE/*

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          if ! command -v yq &> /dev/null; then
            sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_darwin_arm64 -O /usr/local/bin/yq
            sudo chmod +x /usr/local/bin/yq
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Run setup patrol project
        run: |
          make -f integration_test/scripts/setup_patrol.mk setup_patrol
