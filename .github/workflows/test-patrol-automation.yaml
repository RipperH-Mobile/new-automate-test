name: Ubuntu Simulation on Mac

on:
  workflow_dispatch: # กดรันเองเพื่อเทส

jobs:
  simulate-ubuntu:
    runs-on: self-hosted # รันบนเครื่อง Mac ของคุณ
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reset & Boot Ubuntu VM (Lima)
        run: |
          # 1. ลบเครื่องเก่าทิ้งเพื่อให้มั่นใจว่า "สะอาด 100%"
          limactl stop -f ubuntu-tester || true
          limactl delete ubuntu-tester || true
          
          # 2. สร้างและเริ่ม Ubuntu VM ใหม่ (ใช้ template มาตรฐาน)
          # --tty=false เพื่อให้รันแบบ non-interactive ใน CI
          limactl start --name=ubuntu-tester --tty=false template://ubuntu
          
      - name: Install Tools & Run Patrol in Ubuntu
        run: |
          # สั่งงานเข้าไปใน Ubuntu VM ผ่าน limactl shell
          limactl shell ubuntu-tester bash << 'EOF'
            set -e # พังแล้วหยุดทันที
            
            echo "🐧 Inside Ubuntu VM: Starting Clean Installation..."
            
            # 1. Update System
            sudo apt-get update && sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa
            
            # 2. Install Java 17 (เหมือนที่ GitHub Actions มีให้)
            sudo apt-get install -y openjdk-17-jdk
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            
            # 3. Install Flutter (เริ่มจากศูนย์)
            git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
            export PATH="$PATH:$HOME/flutter/bin"
            
            # 4. Install Patrol CLI
            flutter pub global activate patrol_cli
            export PATH="$PATH:$HOME/.pub-cache/bin"
            
            # 5. ย้ายเข้าไปในโฟลเดอร์โปรเจค
            # Lima จะแชร์ไฟล์จาก Mac มาที่ Path เดียวกันโดยอัตโนมัติ
            cd ${{ github.workspace }}
            
            # 6. ตรวจสอบความพร้อม
            echo "🚀 Final Check with Patrol Doctor..."
            patrol doctor
            
            # 7. ลง patrol
            make -f integration_test/scripts/setup_patrol.mk setup_patrol
          EOF

      - name: Cleanup VM
        if: always()
        run: |
          # ปิดเครื่องหลังรันเสร็จเพื่อประหยัด RAM เครื่อง Mac
          limactl stop ubuntu-tester

