name: Patrol Test Android

on:
  workflow_dispatch:

jobs:
  patrol-test:
    runs-on: ubuntu-latest

    steps:
      # ดึง Source Code ของโปรเจกต์
      - name: Checkout Code
        uses: actions/checkout@v4

      # เรียกใช้ก้อน Setup ที่แยกไฟล์ไว้
      - name: Setup Environment
        uses: ./.github/actions/test-setup-flutter-patrol

      # ตั้งค่า Android SDK
      - name: Setup Android SDK
        run: |
          echo "🤖 Accepting Licenses and Installing Android SDK Components..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      # ตั้งค่า Android platform-tools
      - name: Add Android platform-tools to PATH
        run: echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # ยอมรับ Flutter Android Licenses
      - name: Configure Flutter and Accept Licenses
        run: |
          echo "🤖 Disabling Linux Desktop to speed up CI and clear Doctor warnings..."
          fvm flutter config --no-enable-linux-desktop
          echo "🤖 Accepting Flutter Android Licenses..."
          yes | fvm flutter doctor --android-licenses

      - name: Setup Patrol
        run: |
          make -f integration_test/scripts/setup_patrol.mk setup_patrol

      # ตรวจสอบ Dependency ของ Flutter และ Patrol
      - name: Check Patrol Doctor and Flutter Doctor
        uses: ./.github/actions/test-doctor-flutter-patrol
