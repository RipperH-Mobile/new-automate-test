name: Ubuntu Simulation on Mac

on:
  workflow_dispatch: # กดรันเองเพื่อเทส

jobs:
  simulate-ubuntu:
    runs-on: self-hosted # รันบนเครื่อง Mac ของคุณ

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Ubuntu VM (Lima)
        run: |
          # เช็คว่ามีเครื่อง ubuntu-tester อยู่แล้วหรือไม่
          if limactl ls | grep -q "ubuntu-tester"; then
            echo "♻️ VM exists. Starting it..."
            limactl start ubuntu-tester || true
          else
            echo "🆕 VM not found. Creating and starting a new one..."
            limactl start --name=ubuntu-tester --tty=false template://ubuntu
          fi

      - name: Install Tools & Run Patrol in Ubuntu
        run: |
          # สั่งงานเข้าไปใน Ubuntu VM ผ่าน limactl shell
          limactl shell ubuntu-tester bash << 'EOF'
            set -e # พังแล้วหยุดทันที
            
            echo "🐧 Inside Ubuntu VM: Starting Installation..."
            
            # 1. Update System
            sudo apt-get update && sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa make adb
            
            # 2. Install Java 17
            sudo apt-get install -y openjdk-17-jdk
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)

            echo "🤖 Installing Android SDK Command-line Tools..."
            
            # 2. สร้างโฟลเดอร์และตั้งค่า ANDROID_HOME
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p $ANDROID_HOME/cmdline-tools
            
            # 2. ดาวน์โหลด Android Command Line Tools (เวอร์ชันล่าสุดสำหรับ Linux)
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
            
            # 2. จัดโครงสร้างโฟลเดอร์ให้ถูกต้องตามที่ Android SDK ต้องการ
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            rm /tmp/cmdline-tools.zip
            
            # 2. อัปเดต PATH ให้เรียกคำสั่ง sdkmanager และ adb ได้
            export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
            
            # 2. กดยอมรับ License ทั้งหมดอัตโนมัติ (สำคัญมาก! ถ้าไม่ทำ Flutter จะ build ไม่ผ่าน)
            yes | sdkmanager --licenses
            
            # 2. ติดตั้ง Packages พื้นฐาน
            sdkmanager "platform-tools" "cmdline-tools;latest"
            rm -f $ANDROID_HOME/platform-tools/adb
            ln -s /usr/bin/adb $ANDROID_HOME/platform-tools/adb
            
            # 3. Install Flutter (เริ่มจากศูนย์)
            git clone https://github.com/flutter/flutter.git -b stable $HOME/flutter
            export PATH="$PATH:$HOME/flutter/bin"
            
            # 4. Install Patrol CLI
            flutter pub global activate patrol_cli
            export PATH="$PATH:$HOME/.pub-cache/bin"

            # 6. ลง adb
            export PATH="$ANDROID_HOME/platform-tools:$PATH"

            # 6. ลง fvm
            curl -fsSL https://fvm.app/install.sh | bash
            export PATH="$HOME/fvm/bin:$PATH"

            echo "🔑 Setting up SSH Keys for GitHub access..."
            # 7. ดึง SSH Key จากเครื่อง Mac มาให้ Ubuntu ยืมใช้ เพื่อให้โหลด Package จาก Git ได้
            mkdir -p $HOME/.ssh
            cp /Users/sorawit/.ssh/id_rsa $HOME/.ssh/ 2>/dev/null || true
            cp /Users/sorawit/.ssh/id_ed25519 $HOME/.ssh/ 2>/dev/null || true
            chmod 600 $HOME/.ssh/id_* 2>/dev/null || true
            ssh-keyscan github.com >> $HOME/.ssh/known_hosts

            echo "📂 Copying workspace to VM internal storage for Read/Write access..."
            # 8. ย้ายเข้าไปในโฟลเดอร์โปรเจค (แก้ปัญหา Read-only)
            export VM_WORKSPACE="$HOME/build-workspace"
            source ~/.bashrc
            mkdir -p $VM_WORKSPACE
            cp -a ${{ github.workspace }}/. $VM_WORKSPACE/
            cd $VM_WORKSPACE
            fvm install
            fvm flutter config --android-sdk $ANDROID_HOME
            
            # 7. ลง patrol
            make -f integration_test/scripts/setup_patrol.mk setup_patrol

          EOF

      - name: Check Patrol Doctor and flutter Doctor
        run: |
          # ประกาศ Path ที่จำเป็นอีกครั้งตรงนี้เพื่อให้เรียกใช้ใน VM ได้ชัวร์ๆ
          limactl shell ubuntu-tester bash << 'EOF'
            # 1. บังคับโหลดโปรไฟล์ (เผื่อไว้)
            source ~/.bashrc
            
            # 2. Re-export path สำคัญ (กันพลาดถ้า .bashrc ไม่ทำงาน)
            export ANDROID_HOME=$HOME/android-sdk
            export PATH="$PATH:$HOME/flutter/bin:$HOME/.pub-cache/bin:$ANDROID_HOME/platform-tools:$HOME/fvm/bin"
            export VM_WORKSPACE="$HOME/build-workspace"

            echo "🚀 Moving to workspace: $VM_WORKSPACE"
            cd $VM_WORKSPACE || exit 1

            echo "🚀 Final Check with Patrol Doctor..."
            patrol doctor

            echo "🚀 Final Check with flutter Doctor..."
            # แนะนำให้ระบุ Path เต็มของ flutter หรือ fvm ไปเลยถ้ายังหาไม่เจอ
            flutter doctor
          EOF

      # - name: Cleanup Installed Tools in VM
      #   if: always()
      #   run: |
      #     limactl shell ubuntu-tester bash << 'EOF'
      #       echo "🧹 Cleaning up workspace inside Ubuntu..."

      #       # 💡 1. ลบโฟลเดอร์โปรเจคที่เราก๊อปปี้มา (ลบผลลัพธ์จาก cp -a)
      #       rm -rf $HOME/build-workspace
            
      #       # 1. ลบ Flutter SDK
      #       rm -rf $HOME/flutter
            
      #       # 2. ลบ Pub Cache (เพื่อล้าง Patrol CLI และ dependencies อื่นๆ)
      #       rm -rf $HOME/.pub-cache

      #       # 💡 2. ลบ Android SDK (เพิ่มเข้ามาใหม่เพื่อให้ล้างเครื่อง 100%)
      #       rm -rf $HOME/android-sdk

      #       # ลบกุญแจ SSH ที่ยืมมา
      #       rm -rf $HOME/.ssh

      #       # 1. ถอนการติดตั้งแพ็กเกจที่เกี่ยวกับ OpenJDK 17 ทั้งหมด
      #       sudo apt-get purge -y "openjdk-17-*"
            
      #       # 2. ลบ Dependencies อื่นๆ ที่ถูกติดตั้งมาพร้อมกับ Java แต่ตอนนี้ไม่ได้ใช้แล้ว
      #       sudo apt-get autoremove -y
            
      #       # 3. ล้างแคชของ apt เพื่อคืนพื้นที่ว่างให้ VM
      #       sudo apt-get clean
            
      #       # 4. เคลียร์ตัวแปร JAVA_HOME (เผื่อเซสชันนี้ยังถูกเรียกใช้อยู่)
      #       unset JAVA_HOME
            
      #       echo "✅ Cleanup completed!"
      #     EOF

      - name: Stop VM
        if: always()
        run: |
          # ปิดเครื่องหลังรันเสร็จเพื่อประหยัด RAM เครื่อง Mac แต่ไม่ Delete ทิ้ง
          limactl stop ubuntu-tester || true