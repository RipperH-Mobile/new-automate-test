name: Patrol Automate Test (iOS & Android)

on:
  push:
    branches:
      - 'test/automate'
  workflow_dispatch:

jobs:
  ios-test:
    runs-on: self-hosted
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2

      - name: 🔧 Setup FVM
        run: dart pub global activate fvm

      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Setup Patrol & Dependencies
        run: make -f integration_test/scripts/setup_patrol.mk setup_patrol

#      - name: 📝 Create .env file
#        run: |
#          echo "DB_MONGO_URL=${{ secrets.DB_MONGO_URL }}" >> integration_test/.env.sit
#          echo "DB_MONGO_DB_NAME=${{ secrets.DB_MONGO_DB_NAME }}" >> integration_test/.env.sit
#          echo "DB_MONGO_COLLECTION_SMS_LOGS=smslogs" >> integration_test/.env.sit
#          echo "DB_MONGO_COLLECTION_EMAIL_LOGS=emaillogs" >> integration_test/.env.sit
#          echo "DB_MONGO_COLLECTION_ACCOUNTS=accounts" >> integration_test/.env.sit
#          echo "API_URL_BASE=${{ secrets.API_URL_BASE }}" >> integration_test/.env.sit
#          echo "API_URL_AUTH_OTP=/auth/otp" >> integration_test/.env.sit
#          echo "API_URL_AUTH_SIGN_IN=/auth/sign-in" >> integration_test/.env.sit
#          echo "API_URL_USERS_SETTING_OTP_VERIFY=/users/settings/otp/verify" >> integration_test/.env.sit
#          echo "API_URL_USERS_SETTING_ACCOUNT=/users/settings/account" >> integration_test/.env.sit
#          echo "ACCOUNT_SALT_PASSWORD=${{ secrets.ACCOUNT_SALT_PASSWORD }}" >> integration_test/.env.sit
          
          cp integration_test/.env.sit .env

      - name: 📝 Inject GoogleService-Info.plist
        run: |
            echo "${{ secrets.GOOGLE_SERVICE_INFO_IOS }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: 🍏 Fix & Clean iOS Pods
        run: |   
            fvm flutter clean
            fvm flutter pub get   
            cd ios
            rm -rf Podfile.lock Pods build/
            sed -i '' "s/^platform :ios, .*/platform :ios, '15.0'/g" Podfile || true
            
            # 👇 [เพิ่มส่วนนี้] บังคับปิด Code Signing สำหรับ Simulator
            sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' Runner.xcodeproj/project.pbxproj || true
            sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' Runner.xcodeproj/project.pbxproj || true
            
            # 👇 [เพิ่มส่วนนี้] สคริปต์แก้ปัญหา Pods ทุกตัวให้รองรับ iOS 15.0 ป้องกันการแครช
            cat << 'EOF' >> Podfile
            
            post_install do |installer|
            installer.pods_project.targets.each do |target|
             target.build_configurations.each do |config|
               config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
               config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'i386'
             end
            end
            end
            EOF
            
            pod install --repo-update

      - name: 📱 Run Patrol on iOS Simulator
        run: |
                DEVICE_UUID=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
                xcrun simctl boot $DEVICE_UUID || true
                
                chmod +x ./integration_test/scripts/run_test.sh
                
                fvm dart pub global activate patrol_cli 4.1.0
                
                # ใส่ --verbose เพื่อให้พ่น Log ตัวแดงออกมาให้เห็นชัดๆ
                ./integration_test/scripts/run_test.sh ios 17.5 sit test_suites/suite_feature_account_test.dart
            
      - name: 📁 Upload Patrol Error Log
        if: failure() # ทำงานเฉพาะตอนที่ Build พัง
        uses: actions/upload-artifact@v4
        with:
            name: patrol-error-log
            path: /Users/runner/.pub-cache/log/pub_log.txt
            retention-days: 3

      - name: 📁 Upload iOS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-test-results-ios
          path: integration_test/test_results/*.csv
          retention-days: 7

      - name: 💬 Send iOS Summary to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          chmod +x integration_test/scripts/send_discord_summary.sh
          ./integration_test/scripts/send_discord_summary.sh

