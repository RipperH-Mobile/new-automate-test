name: Patrol Automate Test (iOS Cloud)

on:
  push:
    branches:
      - 'test/automate'
  workflow_dispatch:

jobs:
  ios-test:
    runs-on: macos-latest # ใช้เครื่อง Mac (Apple Silicon) ของ GitHub

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2

      - name: 🔧 Setup FVM (Flutter Version Management)
        run: dart pub global activate fvm

      - name: 🔑 Setup SSH Key for Private Packages
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Setup Patrol & Dependencies
        run: |
          make -f integration_test/scripts/setup_patrol.mk setup_patrol

      - name: 📝 Create .env file for Testing
        run: |
          echo "DB_MONGO_URL=${{ secrets.DB_MONGO_URL }}" >> integration_test/.env.sit
          echo "DB_MONGO_DB_NAME=${{ secrets.DB_MONGO_DB_NAME }}" >> integration_test/.env.sit
          echo "DB_MONGO_COLLECTION_SMS_LOGS=smslogs" >> integration_test/.env.sit
          echo "DB_MONGO_COLLECTION_EMAIL_LOGS=emaillogs" >> integration_test/.env.sit
          echo "DB_MONGO_COLLECTION_ACCOUNTS=accounts" >> integration_test/.env.sit
          echo "API_URL_BASE=${{ secrets.API_URL_BASE }}" >> integration_test/.env.sit
          echo "API_URL_AUTH_OTP=/auth/otp" >> integration_test/.env.sit
          echo "API_URL_AUTH_SIGN_IN=/auth/sign-in" >> integration_test/.env.sit
          echo "API_URL_USERS_SETTING_OTP_VERIFY=/users/settings/otp/verify" >> integration_test/.env.sit
          echo "API_URL_USERS_SETTING_ACCOUNT=/users/settings/account" >> integration_test/.env.sit
          echo "ACCOUNT_SALT_PASSWORD=${{ secrets.ACCOUNT_SALT_PASSWORD }}" >> integration_test/.env.sit


      - name: 🧹 Clean Project Cache
        run: |
            echo "Cleaning Flutter project..."
            fvm flutter clean
            fvm flutter pub get
            cd ios
            rm -rf Pods Podfile.lock
            pod install --repo-update
      - name: 🍏 Fix & Clean iOS Pods
        run: |
            echo "Cleaning Flutter & iOS Pods..."
            fvm flutter clean
            fvm flutter pub get
            cd ios
            rm -rf Podfile.lock Pods
            
            # บังคับตั้งค่า Target ต่ำสุดเป็น iOS 13 เพื่อป้องกัน Plugin บางตัวแครช
            sed -i '' "s/^platform :ios, .*/platform :ios, '13.0'/g" Podfile || true
            
            pod install --repo-update
      - name: 📱 Run Patrol on iOS Simulator
        run: |
            echo "✅ Booting iOS Simulator..."
            # ดึง UUID ของ iPhone เครื่องแรกที่มีอยู่ในระบบและสั่ง Boot อัตโนมัติ (ชัวร์กว่าการฟิกซ์ชื่อเครื่อง)
            DEVICE_UUID=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
            echo "Booting Simulator UUID: $DEVICE_UUID"
            xcrun simctl boot $DEVICE_UUID || true
            
            echo "🚀 Giving script execution permissions..."
            chmod +x ./integration_test/scripts/run_test.sh
            chmod +x ./integration_test/scripts/run_test_batch.sh
            chmod +x ./integration_test/scripts/run_test_single.sh
            
            echo "🚀 Starting Automate Test Suite for iOS..."
            # 🚨 ตัดคำว่า integration_test/ ออกจาก argument ตัวสุดท้าย 🚨
            ./integration_test/scripts/run_test.sh ios 17.5 sit test_suites/suite_feature_account_test.dart
      - name: 📁 Upload Test Results (CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-test-results
          path: integration_test/test_results/*.csv
          retention-days: 7

      - name: 💬 Send Summary to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          chmod +x integration_test/scripts/send_discord_summary.sh
          ./integration_test/scripts/send_discord_summary.sh