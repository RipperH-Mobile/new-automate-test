name: Patrol Minimal Test

on:
  push:
    branches:
      - 'test/automate'
  workflow_dispatch:

jobs:
  # ==========================================
  # 🍎 JOB 1: iOS Simulator (วิ่งบนเครื่อง Mac ของคุณ)
  # ==========================================
  ios-test:
    runs-on: self-hosted # 👈 เปลี่ยนมาใช้ self-hosted ตรงนี้ครับ
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2

      - name: 🔧 Setup FVM
        run: dart pub global activate fvm

      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Setup Patrol & Dependencies
        run: make -f integration_test/scripts/setup_patrol.mk setup_patrol

      - name: 🍏 Fix & Clean iOS Pods
        run: |
          fvm flutter clean
          fvm flutter pub get
          cd ios
          rm -rf Podfile.lock Pods build/
          sed -i '' "s/^platform :ios, .*/platform :ios, '15.0'/g" Podfile || true
          
          # ปิด Code Signing
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' Runner.xcodeproj/project.pbxproj || true
          
          pod install --repo-update

      - name: 📱 Run Patrol on iOS Simulator
        run: |
          DEVICE_UUID=$(xcrun simctl list devices available | grep -i "iPhone" | head -n 1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          xcrun simctl boot $DEVICE_UUID || true
          
          chmod +x ./integration_test/scripts/run_test.sh
          chmod +x ./integration_test/scripts/run_test_batch.sh
          
          fvm dart pub global activate patrol_cli 4.1.0
          
          # สั่งรันเทส (เปิด --verbose เพื่อดู Log ถ้ามันพัง)
          fvm patrol test --flavor sit -t integration_test/test_suites/suite_feature_account_test.dart --dart-define=DEVICE=ios --ios=17.5 --no-uninstall --show-flutter-logs --verbose


  # ==========================================
  # 🤖 JOB 2: Android Emulator (วิ่งบนเครื่อง Mac ของคุณ)
  # ==========================================
  android-test:
    runs-on: self-hosted # 👈 อันนี้ก็วิ่งบนเครื่องคุณเหมือนเดิม
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2

      - name: 🔧 Setup FVM
        run: dart pub global activate fvm

      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: ⚙️ Setup Patrol & Dependencies
        run: make -f integration_test/scripts/setup_patrol.mk setup_patrol

      - name: 📱 Run Patrol on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a # สำหรับ Mac ชิป M1/M2 (เปลี่ยนเป็น x86_64 ถ้าใช้ Intel)
          profile: pixel_6
          script: |
            fvm dart pub global activate patrol_cli 4.1.0
            fvm patrol test --flavor sit -t integration_test/test_suites/suite_feature_account_test.dart --dart-define=DEVICE=android --no-uninstall --show-flutter-logs --verbose