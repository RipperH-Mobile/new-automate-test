name: Patrol Android Automate Test

on:
  push:
    branches:
      - 'test/automate' # รันอัตโนมัติเมื่อ push เข้า branch นี้
  workflow_dispatch: # ทำให้มีปุ่มกด Run manual บนเว็บ GitHub ได้

jobs:
  android-test:
    runs-on: ubuntu-latest # ใช้ Ubuntu เพราะรัน Android Emulator ได้ไวและประหยัดโควต้ากว่า Mac

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' # Android build มักใช้ Java 17

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # flutter-version: '3.19.0' # ปลดคอมเมนต์แล้วระบุเวอร์ชันถ้าโปรเจกต์ฟิกซ์ไว้

      - name: 🔧 Setup FVM (Flutter Version Management)
        # เนื่องจากใน setup_patrol.mk ของคุณมีการใช้คำสั่ง fvm เราจึงต้องติดตั้ง fvm ลงใน Runner ด้วย
        run: dart pub global activate fvm

      - name: ⚙️ Setup Patrol & Dependencies
        run: |
          # รันคำสั่ง Setup ผ่าน Makefile ของคุณที่มีอยู่แล้ว
          make -f integration_test/scripts/setup_patrol.mk setup_patrol

      - name: 📝 Create .env file for Testing
        # สร้างไฟล์ .env.sit ตามที่ ConfigEnvUtil.dart ต้องการ
        run: |
          echo "DB_MONGO_URL=${{ secrets.DB_MONGO_URL }}" >> integration_test/.env.sit
          echo "DB_MONGO_DB_NAME=${{ secrets.DB_MONGO_DB_NAME }}" >> integration_test/.env.sit
          echo "DB_MONGO_COLLECTION_SMS_LOGS=smslogs" >> integration_test/.env.sit
          echo "DB_MONGO_COLLECTION_EMAIL_LOGS=emaillogs" >> integration_test/.env.sit
          echo "DB_MONGO_COLLECTION_ACCOUNTS=accounts" >> integration_test/.env.sit
          echo "API_URL_BASE=${{ secrets.API_URL_BASE }}" >> integration_test/.env.sit
          echo "API_URL_AUTH_OTP=/auth/otp" >> integration_test/.env.sit
          echo "API_URL_AUTH_SIGN_IN=/auth/sign-in" >> integration_test/.env.sit
          echo "API_URL_USERS_SETTING_OTP_VERIFY=/users/settings/otp/verify" >> integration_test/.env.sit
          echo "API_URL_USERS_SETTING_ACCOUNT=/users/settings/account" >> integration_test/.env.sit
          echo "ACCOUNT_SALT_PASSWORD=${{ secrets.ACCOUNT_SALT_PASSWORD }}" >> integration_test/.env.sit

      - name: 📱 Run Patrol on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "✅ Emulator is ready. Giving script execution permissions..."
            chmod +x ./integration_test/scripts/run_test.sh
            chmod +x ./integration_test/scripts/run_test_batch.sh
            chmod +x ./integration_test/scripts/run_test_single.sh
            
            echo "🚀 Starting Automate Test Suite..."
            # สั่งรันเทส suite ของ account เป็นตัวอย่าง (สามารถเพิ่ม/เปลี่ยน path ได้)
            ./integration_test/scripts/run_test.sh android sit integration_test/test_suites/suite_feature_account_test.dart

      - name: 📁 Upload Test Results (CSV)
        if: always() # อัปโหลดไฟล์ CSV เก็บไว้ดูย้อนหลังบน GitHub ได้เสมอ
        uses: actions/upload-artifact@v3
        with:
          name: patrol-test-results
          path: integration_test/test_results/*.csv
          retention-days: 7

      - name: 💬 Send Summary to Discord
        if: always() # บังคับรันเสมอเพื่อส่งผลลัพธ์ไม่ว่าจะ Pass หรือ Fail
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          chmod +x integration_test/scripts/send_discord_summary.sh
          ./integration_test/scripts/send_discord_summary.sh