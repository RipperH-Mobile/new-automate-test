# Documentation: https://pub.dev/packages/msix
# Run build app installer for Windows with command: `dart run msix:publish`
# social_uchat#!
## How to run build app installer for Windows: dart run msix:create
msix_config:
  display_name: UChat
  languages: en-us, th-th
  logo_path: .\assets\app_icons\primary-desktop-icon.png
  icons_background_color: "#ffffff"
  # publisher: Zimpligital
  # publisher_display_name: Zimpligital
  # identity_name: social.uchat
  certificate_path: .\desktop_installers\windows_cer\SOCIAL_UChat.pfx
  certificate_password: social_uchat#!
  install_certificate: false
  capabilities: internetClient, location, microphone, webcam
  app_installer:
    publish_folder_path: .\desktop_installers\installer
    hours_between_update_checks: 0
    automatic_background_task: true
    update_blocks_activation: true
    show_prompt: true
    force_update_from_any_version: false
  # This is the version of the app that will be created in the MSIX package.
  msix_version: 2.14.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_gen:
  output: lib/gen/

  assets:
    exclude:
      - assets/stickers/**
      - assets/mac_app_icons/**

  # Optional
  integrations:
    lottie: true
    flutter_svg: true

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets Setting
  assets:
    - assets/temp_test_data/
    - integration_test/
    - assets/animations/
    - assets/app_icons/
    - assets/audios/
    - assets/audios/call/
    - assets/audios/message/
    - assets/fonts/uchat.ttf
    - assets/images/
    - assets/images/v2/
    - assets/images/output/
    - assets/stickers/
    - assets/stickers/meme_pack/
    - assets/stickers/fomushkina/
    - assets/stickers/dota_stickers/
    - assets/stickers/pusheen/
